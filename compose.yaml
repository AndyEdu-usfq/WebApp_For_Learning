services:
  app:
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      APP_USERNAME: ${APP_USERNAME:-learner}
      APP_PASSWORD: ${APP_PASSWORD:?Set APP_PASSWORD in .env}
      APP_DISPLAY_NAME: ${APP_DISPLAY_NAME:-Learner}
      PUBLIC_ORIGIN: ${PUBLIC_ORIGIN:-http://localhost:3000}
    volumes:
      - learning-data:/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
volumes:
  learning-data:
