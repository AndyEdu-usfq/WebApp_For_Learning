name: Verify and containerize
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm typecheck
      - run: pnpm build
      - name: Build container
        run: docker build -t fluency-lab:test .
      - name: Smoke-test private container and persistence
        env:
          APP_PASSWORD: ci-only-password-not-for-deployment
        run: |
          docker volume create fluency-test
          docker run -d --name learning -p 3000:3000 -v fluency-test:/data -e APP_PASSWORD="$APP_PASSWORD" fluency-lab:test
          trap 'docker logs learning; docker rm -f learning' EXIT
          for i in $(seq 1 45); do
            if curl -fsS -u "learner:$APP_PASSWORD" http://localhost:3000/api/progress; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3000/api/progress)" = 401
          curl -fsS -u "learner:$APP_PASSWORD" http://localhost:3000/ | grep -q FluencyLab
          curl -fsS -u "learner:$APP_PASSWORD" -H 'Content-Type: application/json' -d '{"kind":"quiz","lessonId":"b1-stories","answers":[0,1,2]}' http://localhost:3000/api/attempt | grep -q '"score":100'
          test "$(curl -s -o /dev/null -w '%{http_code}' -u "learner:$APP_PASSWORD" -H 'Origin: https://evil.example' http://localhost:3000/api/progress)" = 403
          docker restart learning
          for i in $(seq 1 45); do
            if curl -fsS -u "learner:$APP_PASSWORD" http://localhost:3000/api/progress > /tmp/progress.json; then break; fi
            sleep 2
          done
          node -e "const p=JSON.parse(require('fs').readFileSync('/tmp/progress.json'));if(!p.attempts.some(a=>a.lessonId==='b1-stories'&&a.score===100))process.exit(1)"
